<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allow microphone · UnComet Assistant</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 420px;
        padding: 32px;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        margin: 16px 0 8px;
      }
      p {
        line-height: 1.5;
        opacity: 0.8;
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        background: rgb(11 125 136 / 14%);
        color: #0b7d88;
      }
      .ok .icon {
        background: rgb(47 138 85 / 15%);
        color: #2f8a55;
      }
      .bad .icon {
        background: rgb(196 61 61 / 15%);
        color: #c43d3d;
      }
      button {
        margin-top: 12px;
        font: inherit;
        padding: 8px 16px;
        border-radius: 8px;
        border: none;
        background: #0b7d88;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main id="root">
      <span class="icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3" />
          <path d="M5 10a7 7 0 0 0 14 0M12 17v5" />
        </svg>
      </span>
      <h1 id="title">Allow microphone access</h1>
      <p id="text">Chrome will ask for permission so you can dictate messages in the assistant's side panel.</p>
      <button id="retry" hidden>Ask again</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
