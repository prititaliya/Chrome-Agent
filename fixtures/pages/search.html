<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture Shop Search</title>
  </head>
  <body>
    <h1>Widget search</h1>
    <form action="shop.html" method="GET">
      <label>Search <input type="text" name="q" value="" /></label>
      <button type="submit">Search</button>
    </form>
    <ul>
      <li><a href="shop.html?item=red-widget">Red widget</a> <span class="price">$12.50</span></li>
      <li><a href="shop.html?item=blue-widget">Blue widget</a> <span class="price">$9.99</span></li>
      <li><a href="shop.html?item=green-widget">Green widget</a> <span class="price">$14.00</span></li>
    </ul>
  </body>
</html>
