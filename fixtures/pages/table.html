<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture Price Table</title>
  </head>
  <body>
    <h1>Products</h1>
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Red widget</td>
          <td>$12.50</td>
        </tr>
        <tr>
          <td>Blue widget</td>
          <td>$9.99</td>
        </tr>
        <tr>
          <td>Green widget</td>
          <td>$14.00</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
